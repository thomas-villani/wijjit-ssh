[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wijjit-ssh"
# Single-sourced from src/wijjit_ssh/__init__.py; see [tool.hatch.version].
dynamic = ["version"]
description = "Serve Wijjit TUI apps over SSH - Flask for SSH apps."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Tom Villani", email = "thomas.villani@gmail.com" }]
keywords = ["ssh", "tui", "terminal", "wijjit", "asyncssh", "server"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: User Interfaces",
    "Topic :: System :: Networking",
    "Topic :: System :: Systems Administration",
    "Topic :: Terminals",
    "Typing :: Typed",
]
dependencies = [
    "wijjit>=0.1.0",
    "asyncssh>=2.14",
]

[project.urls]
Homepage = "https://github.com/thomas-villani/wijjit-ssh"
Documentation = "https://thomas-villani.github.io/wijjit-ssh/"
Repository = "https://github.com/thomas-villani/wijjit-ssh"
Issues = "https://github.com/thomas-villani/wijjit-ssh/issues"
Changelog = "https://github.com/thomas-villani/wijjit-ssh/blob/main/CHANGELOG.md"
Wijjit = "https://github.com/thomas-villani/wijjit"

# No [tool.uv.sources] here, deliberately. wijjit resolved from a sibling
# checkout until it reached PyPI; that section is gone as of 0.1.0, so
# `wijjit>=0.1.0` above is now resolved from the real index by every `uv sync`,
# by CI, and by anyone installing this package. release.yml still checks the
# section has not come back - see RELEASING.md for why that check exists.
#
# To develop the two libraries in tandem again, do it locally and do not commit
# it: `uv add --editable ../wijjit` (undo with `uv remove wijjit && uv add
# 'wijjit>=0.1.0'`), or `uv sync` then `uv pip install -e ../wijjit`, which
# leaves pyproject.toml untouched entirely.

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=6.0",
    # A real VT emulator. The round-trip tests need one because Wijjit's diff
    # renderer sends a transcript, not a picture: only an emulator reconstructs
    # the screen a user would actually see. See tests/_client.py.
    "pyte>=0.8",
    "black>=24.0",
    "ruff>=0.16.1",
    "mypy>=1.10",
    # tests/test_examples.py imports every example, so the dashboard's psutil is
    # a test dependency now and a plain `uv sync` has to bring it. Included
    # rather than duplicated, so `--group examples` stays the one thing a user
    # runs to get the dashboard and there is only one version bound to bump.
    { include-group = "examples" },
]
# What examples/dashboard_ssh.py needs, and nothing else in the tree does:
#   uv run --group examples python examples/dashboard_ssh.py
# Kept as its own group so that command still reads as "install what this one
# example wants", even though `dev` now pulls it in as well.
examples = [
    "psutil>=5.9",
]
# Not in `dev`, and so not installed by a plain `uv sync`: Sphinx and its theme
# pull in a couple of dozen packages that a contributor running the test suite
# has no use for. `uv sync --group docs` when you want to build the site.
docs = [
    "sphinx>=8.2",
    "sphinx-rtd-theme>=3.0",
    "sphinx-copybutton>=0.5.2",
    "sphinx-tabs>=3.4.7",
    "myst-parser>=2.0",
]

[tool.hatch.version]
path = "src/wijjit_ssh/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/wijjit_ssh"]

# Explicit sdist contents so the build is deterministic and never walks stray
# local directories (this repo keeps a .venv/ in tree).
#
# Every pattern is anchored with a leading "/". Hatchling matches these
# gitignore-style, so a bare `examples` matches a directory of that name at ANY
# depth - which silently pulled `docs/source/examples/*.rst` into the sdist while
# the rest of docs/ stayed out. Anchoring says the repository root and means it.
#
# docs/ is listed as its two source paths rather than as `/docs`, so `docs/build`
# cannot arrive here even if someone builds the site before running `uv build`.
[tool.hatch.build.targets.sdist]
include = [
    "/src/wijjit_ssh",
    "/tests",
    "/examples",
    "/deploy",
    "/docs/source",
    "/docs/Makefile",
    "/docs/make.bat",
    "/README.md",
    "/CHANGELOG.md",
    "/CONTRIBUTING.md",
    "/SECURITY.md",
    "/RELEASING.md",
    "/LICENSE",
    "/SPEC.md",
    "/pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.black]
line-length = 88
# Pinned, not inferred: without it black guesses a target from the installed
# interpreter and warns that it "cannot parse code formatted for Python 3.15",
# which is a warning in every CI log that everyone then learns to ignore.
target-version = ["py311"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
