version: 2

updates:
  # Pinned action majors (actions/checkout@v7, astral-sh/setup-uv@v7, ...) go
  # stale silently: nothing fails, the workflow just keeps running an older
  # runner image until the version is deprecated and every job starts warning
  # at once.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      # Match the repo's convention: sentence-case subject, no `feat:`/`chore:`
      # prefixes. See CONTRIBUTING.md.
      prefix: Bump
    groups:
      actions:
        patterns: ["*"]

  # CI runs `uv sync --locked` as of 0.1.0, so `uv.lock` is a reviewed artifact
  # and these PRs are how it moves. That includes `wijjit`: the pin is
  # `wijjit>=0.1.0` with no upper bound, and the seam this package implements
  # (TerminalBackend / InputSource) lives upstream, so a wijjit bump landing as
  # its own PR with the full test matrix behind it is the point rather than
  # noise. It is deliberately not in the groups below, for the same reason.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: Bump
    groups:
      dev-tooling:
        # One PR for the formatter/linter/type-checker/test stack. They are
        # updated together or not at all; a black bump that reformats the tree
        # is not worth its own review round.
        patterns:
          - black
          - ruff
          - mypy
          - pytest*
          - pyte
      docs:
        patterns:
          - sphinx*
          - myst-parser
