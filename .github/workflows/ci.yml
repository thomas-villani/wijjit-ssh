name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# An ordinary single-checkout workflow as of 0.1.0.
#
# Until wijjit reached PyPI, every job here checked out *two* repositories as
# siblings, because pyproject.toml resolved wijjit through
# `[tool.uv.sources] wijjit = { path = "../wijjit" }` and a runner had no sibling
# to point at. That is gone: wijjit is an ordinary PyPI dependency now, so the
# second checkout, the `path:` on the first, and the `working-directory:` on
# every `run:` all went with it.
#
# The tradeoff that removal makes, worth naming: CI used to track wijjit `main`,
# so a wijjit change that broke the TerminalBackend / InputSource seam reddened
# this repo the day it landed. Now it is caught when the pin moves instead. If
# that gap matters, the fix is a separate scheduled job that installs wijjit from
# git, not a return to the two-checkout arrangement here.

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Sync dependencies
        # `--locked` now that wijjit is an ordinary registry pin: uv.lock no
        # longer moves whenever a sibling checkout's own dependencies do, so a
        # lockfile that disagrees with pyproject.toml is a real error and should
        # fail rather than be silently resolved around.
        #
        # uv fetches the interpreter itself, so there is no actions/setup-python step.
        run: uv sync --locked --python ${{ matrix.python-version }}

      - name: Run tests
        # Four tests are POSIX-only (the 0600 host-key mode bits, the permission
        # warning, and the end-to-end SIGTERM drain) and skip on Windows. The
        # ubuntu and macOS legs are the only place they run at all.
        run: uv run pytest -q --tb=short

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Sync dependencies
        run: uv sync --locked --python 3.11

      # tests/, examples/, and deploy/ are linted alongside src/, unlike the
      # wijjit repo's own workflow. They are already clean, so there is no reason
      # to leave them unguarded - and deploy/healthcheck.py in particular is a
      # script people copy into a Dockerfile, so it should hold the same bar.
      - name: ruff
        run: uv run ruff check src/ tests/ examples/ deploy/

      - name: black
        run: uv run black --check src/ tests/ examples/ deploy/

      - name: mypy
        run: uv run mypy src/ deploy/

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Sync dependencies
        run: uv sync --locked --python 3.11

      - name: Run tests with coverage
        run: >
          uv run pytest
          --cov=src/wijjit_ssh
          --cov-report=xml
          --cov-report=term-missing
          -q

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
